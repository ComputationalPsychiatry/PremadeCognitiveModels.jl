name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on pull requests
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
      id-token: write # lets codecov-action authenticate with OIDC
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        # Ubuntu for dev; all platforms for main and pull requests into main
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.base_ref == 'main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-core
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  ad_and_reactant:
    name: AD and Reactant - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each suite has its own environment in test/ad_and_reactant/
        suite:
          - ad
          - reactant
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-core
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install the test environment
        run: julia --color=yes --project=test/ad_and_reactant/${{ matrix.suite }} -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests
        run: julia --color=yes --project=test/ad_and_reactant/${{ matrix.suite }} test/ad_and_reactant/${{ matrix.suite }}/runtests.jl
